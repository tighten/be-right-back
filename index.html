<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Be Right Back</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --text: #6b7280;
            --strong: #374151;
            --rule: #d1d5db;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --text: #9ca3af;
                --strong: #e5e7eb;
                --rule: #374151;
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .wrap {
            display: flex;
            align-items: center;
            text-align: center;
        }
        .code {
            padding-right: 1rem;
            margin-right: 1rem;
            border-right: 1px solid var(--rule);
            font-size: 1.125rem;
            letter-spacing: 0.05em;
            color: var(--strong);
        }
        .msg {
            font-size: 1.125rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .sub {
            margin-top: 1.25rem;
            font-size: 0.875rem;
            text-align: center;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <main>
        <div class="wrap">
            <div class="code">503</div>
            <div class="msg">Be Right Back</div>
        </div>
        <p class="sub">We're doing some maintenance. Please check back soon.</p>
    </main>
</body>
</html>
